  /api/transfer/{monitorId}/replay:
    post:
      summary: Get replay data or replay a previous transfer
      description: Depending on the action specified in the body, this endpoint either retrieves the configuration
        of a previous transfer using its monitorId ('get' action) or automatically initiates a new transfer
        session with that configuration ('replay' action).
      tags:
      - Transfer
      parameters:
      - in: path
        name: monitorId
        required: true
        schema:
          type: string
        description: Monitor ID of the original transfer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - get
                  - replay
                  default: replay
                  description: The action to perform. 'get' retrieves the transfer configuration. 'replay'
                    (default) executes a new transfer.
      responses:
        '200':
          description: Successful response (for 'get' action) returning the replay configuration, or 201
            for a newly created transfer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    description: The replay data configuration (if action='get') or the newly created
                      transfer details (if action='replay')
      operationId: replayTransfer
