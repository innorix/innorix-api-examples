  /api/upload/local:
    post:
      summary: Upload files to local server disk (not cloud storage)
      description: 'Handles file uploads to local disk storage. This endpoint supports multiple actions:

        - getServerInfo: Check server availability

        - getFileInfo: Prepare file upload information

        - attachFile: Upload file chunks

        - attachFileCompleted: Verify completed upload


        **Use this for**: Small files like avatars, profile images, temporary files

        **For large files or customer transfers**: Use /api/upload (cloud storage)

        '
      tags:
      - Upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - _action
              properties:
                _action:
                  type: string
                  enum:
                  - getServerInfo
                  - getFileInfo
                  - attachFile
                  - attachFileCompleted
                  - speedCheck
                  description: The upload action to perform
                _file:
                  type: string
                  format: binary
                  description: The file to upload (required for attachFile action)
                _orig_filename:
                  type: string
                  description: Original filename (required for getFileInfo, attachFile)
                _filesize:
                  type: integer
                  description: File size in bytes
                _userId:
                  type: string
                  description: User ID for organizing files
                _rootPath:
                  type: string
                  description: Root path for saving files
                _subdir:
                  type: string
                  description: Subdirectory for saving files
                _folder:
                  type: string
                  description: Folder name for file organization
      responses:
        '200':
          description: Upload action completed successfully
          content:
            text/plain:
              schema:
                type: string
                example: '<file_code>0000</file_code>

                  <file_savefilename>example.jpg</file_savefilename>

                  <file_savepath>/uploads/user123/example.jpg</file_savepath>

                  '
        '400':
          description: Invalid request or unknown action
        '500':
          description: Server error during upload
      operationId: createUploadLocal
      parameters: []
