openapi: 3.0.0
info:
  title: API documentation
  version: 1.0.0
  description: API documentation for managing services
servers:
- url: https://app.innorix.com
  description: Document For API
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your access token
    RefreshTokenAuth:
      type: apiKey
      in: header
      name: X-Refresh-Token
      description: Enter your refresh token in the X-Refresh-Token header
    WorkSpaceId:
      type: apiKey
      in: header
      name: x-workspace-id
      description: Enter your workspace
    CommandApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Enter your command automation API key to trigger a command automation
  schemas:
    AutomationComponent:
      type: object
      properties:
        componentId:
          type: string
          example: 6f2cf087-23b1-4f4a-97a2-6f7d7f884f56
        automationDetailId:
          type: string
          example: D1234-5678-9012-3456
        type:
          type: string
          enum:
          - webpage
          - ai_pipeline
          - workflow
          example: ai_pipeline
        url:
          type: string
          nullable: true
          example: https://example.com/pipeline
        storagePath:
          type: string
          nullable: true
          example: /automation/components/pipeline
        tags:
          type: array
          items:
            type: string
          example:
          - Upload
          - Portal
        authType:
          type: string
          nullable: true
          example: API Key
        authKey:
          type: string
          nullable: true
          example: secret-value
        outboundMethod:
          type: string
          nullable: true
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          example: POST
        outboundEndpointUrl:
          type: string
          nullable: true
          example: https://api.example.com/events
        outboundEventPayload:
          type: object
          nullable: true
          additionalProperties: true
          example:
            fileId: file_001
            path: /upload/data.csv
        webhookUrl:
          type: string
          nullable: true
          example: https://example.com/webhook
        webhookSecretToken:
          type: string
          nullable: true
          example: webhook-secret
        webhookEventPayload:
          type: object
          nullable: true
          additionalProperties: true
          example:
            fileId: file_001
            path: /upload/data.csv
            userId: user_001
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AutomationComponentInput:
      type: object
      required:
      - automationDetailId
      - type
      properties:
        automationDetailId:
          type: string
        type:
          type: string
          enum:
          - webpage
          - ai_pipeline
          - workflow
        url:
          type: string
        storagePath:
          type: string
        tags:
          type: array
          items:
            type: string
        authType:
          type: string
        authKey:
          type: string
        outboundMethod:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        outboundEndpointUrl:
          type: string
        outboundEventPayload:
          type: object
          additionalProperties: true
        webhookUrl:
          type: string
        webhookSecretToken:
          type: string
        webhookEventPayload:
          type: object
          additionalProperties: true
    PolicyManagementUserAccess:
      type: object
      properties:
        policyManagementId:
          type: integer
          example: 12
        userId:
          type: string
          example: user-uuid
        email:
          type: string
          format: email
        userName:
          type: string
        permission:
          type: integer
          enum:
          - 1
          - 2
          description: 1 = Read Only, 2 = Read and Write
    PolicyManagementPolicy:
      type: object
      properties:
        policyManagementId:
          type: integer
        workSpaceId:
          type: string
        scopeType:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1 = Workspace, 2 = Device Group, 3 = Device
        scopeId:
          type: string
        networkZone:
          type: integer
          enum:
          - 1
          - 2
          description: 1 = Allow All, 2 = Same Network Zone Only
        transferPermission:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          description: 0 = None, 1 = Read Only, 2 = Write Only, 3 = Read and Write
        userAccessEnabled:
          type: boolean
          readOnly: true
          description: Computed as true when the policy has at least one user-access record
        restrictedEnabled:
          type: boolean
          readOnly: true
          description: Computed as true when at least one restrictedFile category is not empty
        userAccess:
          type: array
          items:
            $ref: '#/components/schemas/PolicyManagementUserAccess'
    PolicyManagementUpdateRequest:
      type: object
      minProperties: 1
      properties:
        networkZone:
          type: integer
          enum:
          - 1
          - 2
        transferPermission:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
        restrictedFile:
          $ref: '#/components/schemas/PolicyManagementRestrictedFile'
      example:
        networkZone: 2
        transferPermission: 3
        restrictedFile:
          executables:
          - exe
          - dll
          certificates:
          - pfx
          databases:
          - sqlite
          disks:
          - iso
          windows:
          - C:/Windows/System32
          mac: []
          debianLinux:
          - /etc
          rhelLinux: []
    PolicyManagementRestrictedFile:
      type: object
      additionalProperties: false
      properties:
        executables:
          type: array
          maxItems: 500
          items:
            type: string
        certificates:
          type: array
          maxItems: 500
          items:
            type: string
        databases:
          type: array
          maxItems: 500
          items:
            type: string
        disks:
          type: array
          maxItems: 500
          items:
            type: string
        windows:
          type: array
          maxItems: 500
          items:
            type: string
        mac:
          type: array
          maxItems: 500
          items:
            type: string
        debianLinux:
          type: array
          maxItems: 500
          items:
            type: string
        rhelLinux:
          type: array
          maxItems: 500
          items:
            type: string
    PolicyManagementUserAccessCreateRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: member@example.com
    PolicyManagementUserAccessUpdateRequest:
      type: object
      required:
      - userId
      - permission
      properties:
        userId:
          type: string
          example: user-uuid
        permission:
          type: integer
          enum:
          - 1
          - 2
    PolicyManagementUserAccessDeleteRequest:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          example: user-uuid
    CreateQRRequest:
      type: object
      required:
      - payload
      properties:
        type:
          type: string
          example: LOGIN_EXACOOLA
        payload:
          type: object
          properties:
            deviceId:
              type: string
              example: DEVICE_001
    QRResponse:
      type: object
      properties:
        code:
          type: string
          example: 8a7sd98asd7a98sd
        type:
          type: string
          example: LOGIN_EXACOOLA
        payload:
          type: object
        createdAt:
          type: number
          example: 1748148000000
        expiresAt:
          type: number
          example: 1748148060000
        createdBy:
          type: string
          nullable: true
          example: user_123
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - USED
          example: PENDING
    LoginApproveRequest:
      type: object
      required:
      - code
      - action
      properties:
        code:
          type: string
          example: 8a7sd98asd7a98sd
        action:
          type: string
          enum:
          - APPROVED
          - REJECTED
          example: APPROVED
        userId:
          type: string
          example: user_123
    GroupedTransfer:
      type: object
      properties:
        automationName:
          type: string
          description: Name of the automation (for scheduled transfers)
        automationStatus:
          type: integer
          description: Status of the automation
        transferId:
          type: string
          description: Comma-separated list of transfer IDs in this group
        monitorId:
          type: string
          description: Comma-separated list of monitor IDs in this group
        sourceId:
          type: string
          description: Source device ID
        targetId:
          type: string
          description: Target device ID
        sourceDeviceName:
          type: string
          description: Name of the source device
        targetDeviceName:
          type: string
          description: Name of the target device
        sourceOsType:
          type: string
          description: OS type of the source device
        targetOsType:
          type: string
          description: OS type of the target device
        totalSize:
          type: integer
          format: int64
          description: Total size of the transfer in bytes
        transferSize:
          type: integer
          format: int64
          description: Transferred size in bytes
        transferTime:
          type: integer
          description: Transfer duration in seconds
        formattedTransferTime:
          type: string
          description: Formatted transfer duration (HH:MM:SS)
        startDate:
          type: string
          format: date-time
          description: When the transfer started
        endDate:
          type: string
          format: date-time
          description: When the transfer ended
        status:
          type: integer
          description: Status code of the transfer
        percent:
          type: number
          format: float
          description: Transfer completion percentage
        targetPath:
          type: string
          description: Target path of the transfer
        createdAt:
          type: string
          format: date-time
          description: When the transfer record was created
        from:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInfo'
          description: Source device information
        to:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInfo'
          description: Target device information
    DeviceInfo:
      type: object
      properties:
        osType:
          type: string
          description: Device OS type
        deviceId:
          type: string
          description: Device ID
        deviceName:
          type: string
          description: Device name
    DeviceGroup:
      type: object
      description: (auto-added stub — referenced by the original spec but not defined)
    ErrorResponse:
      type: object
      properties:
        status_code:
          type: integer
          example: 400
        message:
          type: string
          example: error
        error:
          type: integer
          description: Application-specific error code
          example: 11263
    User:
      type: object
      description: (auto-added stub — referenced by the original spec but not defined)
    StandardSuccessResponse:
      type: object
      properties:
        status_code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          description: Response payload (shape varies by endpoint)
security:
- BearerAuth: []
  RefreshTokenAuth: []
  WorkSpaceId: []
paths:
  /api/access-history:
    get:
      summary: Get a list of access history
      description: Get a list of access history
      tags:
      - AccessHistory
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
        description: The page number for pagination
      - in: query
        name: size
        required: false
        schema:
          type: integer
          default: 50
        description: The size of the page
      - in: query
        name: searchKeyword
        required: false
        schema:
          type: string
          example: ''
      - in: query
        name: sort
        required: false
        schema:
          type: string
        description: field:sort
      responses:
        '200':
          description: Get Access History successfully
        '400':
          description: Invalid request data
        '500':
          description: Server error
      operationId: listAccessHistory
  /api/access-history/export-csv:
    get:
      summary: Export access history as CSV
      description: Export access history data as a CSV file using the same filters as the access history
        list.
      tags:
      - AccessHistory
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
        description: Page number for pagination when building the CSV
      - in: query
        name: size
        required: false
        schema:
          type: integer
          default: 10000
        description: Page size when building the CSV
      - in: query
        name: searchKeyword
        required: false
        schema:
          type: string
          example: ''
        description: Optional search keyword
      - in: query
        name: sort
        required: false
        schema:
          type: string
        description: Sort expression, e.g. "createdAt:desc"
      responses:
        '200':
          description: CSV file stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request data
        '500':
          description: Server error
      operationId: exportCsvAccessHistory
  /api/access-history/sync-monitor:
    post:
      summary: Sync monitor data
      description: Sync monitor data
      tags:
      - AccessHistory
      responses:
        '200':
          description: Sync result with successfully synced monitoring apps
        '400':
          description: Invalid request data
        '500':
          description: Server error
      operationId: syncMonitorAccessHistory
      parameters: []
  /api/auth/login:
    post:
      summary: User login
      description: Authenticate user using email and password
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: test@innorix.com
                  description: User's email address
                password:
                  type: string
                  format: password
                  example: 2024Costomi!
                  description: User's password
      parameters:
      - in: query
        name: type
        schema:
          type: string
        required: false
        description: Example query parameter
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          email:
                            type: string
                            example: chis@innorix.com
                          name:
                            type: string
                            example: chis
                          accessToken:
                            type: string
                            example: string
                          refreshToken:
                            type: string
                            example: string
        '400':
          description: 'Request parameters or body are invalid. Cases: missing or invalid parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized, invalid email or password
        '500':
          description: Internal server error
      operationId: loginAuth
  /api/auth/login-by-demo:
    post:
      summary: User login demo
      description: Authenticate user using email and password
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: test@innorix.com
                  description: User's email address
                password:
                  type: string
                  format: password
                  example: 2024Costomi!
                  description: User's password
      parameters:
      - in: query
        name: type
        schema:
          type: string
        required: false
        description: Example query parameter
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          email:
                            type: string
                            example: chis@innorix.com
                          name:
                            type: string
                            example: chis
                          accessToken:
                            type: string
                            example: string
                          refreshToken:
                            type: string
                            example: string
        '400':
          description: Bad request, missing or invalid parameters
        '401':
          description: Unauthorized, invalid email or password
        '500':
          description: Internal server error
      operationId: loginByDemoAuth
  /api/auth/login/free:
    post:
      summary: User login
      description: Authenticate user using email and password
      tags:
      - Auth
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: 'Request parameters or body are invalid. Cases: Guest mode is blocked; Free login
            is only available in Exacoola Cloud mode; Too many login requests, please try again later;
            Guest user cannot join workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized, invalid email or password
        '403':
          description: User does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
      operationId: createAuthLoginFree
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Request body fields must be confirmed against the controller/service before
                final publication.
  /api/auth/logout:
    get:
      summary: Logout user
      tags:
      - Auth
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      operationId: logoutAuth
      parameters: []
  /api/auth/get-token:
    get:
      summary: Get a new access token
      tags:
      - Auth
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          email:
                            type: string
                            example: chis@innorix.com
                          name:
                            type: string
                            example: chis
                          accessToken:
                            type: string
                            example: string
                          refreshToken:
                            type: string
                            example: string
        '400':
          description: 'Request parameters or body are invalid. Cases: missing or invalid parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Authentication is required or token is invalid. Cases: AUTHENTICATION_ERROR.MISSING_REFRESH_TOKEN
            [code: 11265]; AUTHENTICATION_ERROR.REFRESH_TOKEN_EXPIRE [code: 11120]; AUTHENTICATION_ERROR.INVALID_REFRESH_TOKEN
            [code: 11121].'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
      operationId: listAuthGetToken
      parameters:
      - name: x-refresh-token
        in: header
        required: false
        schema:
          type: string
        description: x-refresh-token header value.
      description: 'Retrieves auth data for: Get a new access token.'
  /api/auth/send-code:
    post:
      summary: Send verification code
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: email email address.
                isSignup:
                  type: boolean
                  description: isSignup flag.
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Verification code sent successfully
        '400':
          description: 'Request parameters or body are invalid. Cases: User already exists; USER_ERROR.USER_NOT_FOUND
            [code: 11263].'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
      operationId: sendCodeAuth
      parameters: []
      description: 'Creates or runs auth data for: Send verification code.'
  /api/auth/code-login-session:
    post:
      summary: Generate code login session
      tags:
      - Auth
      responses:
        '200':
          description: Code login session generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: 'Request parameters or body are invalid. Cases: Invalid email payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
      operationId: createAuthCodeLoginSession
      parameters: []
      description: 'Creates or runs auth data for: Generate code login session.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Request body fields must be confirmed against the controller/service before
                final publication.
  /api/auth/reset-password:
    post:
      summary: Reset user password
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: email email address.
                password:
                  type: string
                  description: password value.
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Password changed successfully
        '400':
          description: 'Request parameters or body are invalid. Cases: Invalid email or password payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
      operationId: resetPasswordAuth
      parameters: []
      description: 'Creates or runs auth data for: Reset user password.'
  /api/auth/verify:
    post:
      summary: User login
      description: Authenticate user using email and password
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: test@innorix.com
                  description: User's email address
                code:
                  type: string
                  format: password
                  example: 8888
                  description: code
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: success
        '400':
          description: Bad request, missing or invalid parameters
        '401':
          description: Unauthorized, invalid email or password
        '500':
          description: Internal server error
      operationId: verifyAuth
      parameters: []
  /api/auth/activate-account:
