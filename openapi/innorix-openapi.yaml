  /api/automation/{automationId}/copy-transfer-options:
    get:
      summary: Get a copy-ready automation payload from an existing automation
      description: 'Fetches an existing automation and returns a pre-built payload for creating a new

        automation that inherits the same transfer options.

        Use `keepMode=source` to keep the source device/path and let the caller supply a new target.

        Use `keepMode=target` to keep the target device/path and let the caller supply a new source.

        '
      tags:
      - Automation
      parameters:
      - in: path
        name: automationId
        required: true
        schema:
          type: string
        description: The automation ID to copy options from
      - in: query
        name: keepMode
        required: false
        schema:
          type: string
          enum:
          - source
          - target
          default: source
        description: 'Which side to keep from the original automation.

          "source" keeps sourceId + sourceItem, clears targetId + targetPath.

          "target" keeps targetId + targetPath, clears sourceId + sourceItem.

          '
      - in: query
        name: detailIndex
        required: false
        schema:
          type: integer
          default: 0
        description: Zero-based index of the automation detail to copy (default 0)
      responses:
        '200':
          description: Ready-to-use automation copy payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      automation:
                        type: object
                        description: Summary of the source automation
                      originalDetail:
                        type: object
                        description: The original automation detail at detailIndex
                      keepMode:
                        type: string
                        enum:
                        - source
                        - target
                      keptDetail:
                        type: object
                        description: The detail with the unkept side cleared
                      copyPayload:
                        type: object
                        description: Full body payload ready to POST to /api/automation
        '400':
          description: Missing or invalid automationId
        '404':
          description: Automation not found
      operationId: copyTransferOptionsAutomation
  /api/automation/{automationId}:
    get:
      summary: Get a automation detail by ID
      tags:
      - Automation
      parameters:
      - in: path
        name: automationId
        required: true
        schema:
          type: string
        description: ID of the automation to get detail
      responses:
        '200':
          description: Successful response
      operationId: getAutomation
    patch:
      summary: Update Automation
      description: Updates an existing automation with the specified ID
      tags:
      - Automation
      parameters:
      - in: path
        name: automationId
        required: true
        schema:
          type: string
        description: The ID of the automation to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - schedule
              - details
              properties:
                name:
                  type: string
                  description: Automation name
                schedule:
                  type: object
                  required:
                  - type
                  - hour
                  - minute
                  - timezone
                  - startDate
                  - endDate
                  properties:
                    type:
                      type: string
                      enum:
                      - hour
                      - day
                      - week
                      - month
                      - realtime
                      description: The type of schedule
                    hour:
                      type: string
                      description: Hour of the schedule (e.g., "09" for 9 AM)
                    minute:
                      type: string
                      description: Minute of the schedule (e.g., "30" for 30 minutes past the hour)
                    timezone:
                      type: string
                      description: Timezone for the schedule (e.g., "America/New_York")
                    startDate:
                      type: string
                      format: date-time
                      description: Start time of the automation in ISO 8601 format
                    endDate:
                      type: string
                      format: date-time
                      description: End time of the automation in ISO 8601 format
                  description: Schedule setup for automation
                details:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceItem
                    - targetPath
                    - senderId
                    - receiverId
                    - step
                    properties:
                      sourceItem:
                        type: array
                        items:
                          type: string
                        description: List of source file paths
                      targetPath:
                        type: string
                        description: Destination path for the automation
                      senderId:
                        type: string
                        description: ID of the sender
                      fileCount:
                        type: number
                        description: Number of files
                      folderCount:
                        type: number
                        description: Number of folders
                      sizeCount:
                        type: number
                        description: Total size in bytes
                      receiverId:
                        type: string
                        description: ID of the receiver
                      step:
                        type: integer
                        description: Step number in the automation process
                  description: List of details for automation
              description: Schema for updating an automation
            example:
              name: Automation e7f2a9b3-5c1d-4e9a-8b72-3d4e9f102a8c
              schedule:
                type: day
                hour: 09
                minute: '30'
                timezone: America/New_York
                startDate: '2025-02-27T14:30:00.000Z'
                endDate: '2025-02-28T14:30:00.000Z'
              details:
              - sourceItem:
                - D:/Projects/data/exported_users.csv
                - D:/Projects/data/sales_report.pdf
                targetPath: D:/Backup/Daily_Reports
                senderId: user123
                receiverId: backup_sys_001
                step: 1
                fileCount: 2
                folderCount: 0
                sizeCount: 1000
              - sourceItem:
