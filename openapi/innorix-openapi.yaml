  /api/transfer/dump-transfer-files-5m:
    post:
      summary: Dump transfer file test data
      description: Create one master transfer history record and dump transfer file records into MongoDB.
        Defaults to 5,000,000 records.
      tags:
      - Transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sourceId
              - targetId
              - monitorId
              properties:
                sourceId:
                  type: string
                  description: Source device ID.
                  example: source-device-id
                targetId:
                  type: string
                  description: Target device ID.
                  example: target-device-id
                monitorId:
                  type: string
                  description: Monitor ID used for the generated history and transfer file records.
                  example: monitor-id
                targetPath:
                  type: string
                  description: Optional target root path for generated files.
                  example: /dummy-transfer/target
                type:
                  type: string
                  enum:
                  - mysql
                  - mongo
                  default: mysql
                  description: Storage target for generated transfer file records. mysql inserts into
                    SQL irx_transferFile, mongo inserts into MongoDB irx_transferFile.
                  example: mysql
                count:
                  type: integer
                  description: Optional number of transfer file records to create. Defaults to 5,000,000.
                  example: 5000000
                batchSize:
                  type: integer
                  description: Optional insert batch size. Defaults to 500.
                  example: 500
            example:
              sourceId: source-device-id
              targetId: target-device-id
              monitorId: monitor-id
              type: mysql
      responses:
        '201':
          description: Dump completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      transferId:
                        type: string
                      monitorId:
                        type: string
                      historyTransferId:
                        type: string
                      requestedCount:
                        type: integer
                        example: 5000000
                      insertedCount:
                        type: integer
                        example: 5000000
                      batchSize:
                        type: integer
                        example: 500
                      type:
                        type: string
                        example: mysql
                      durationMs:
                        type: integer
                        example: 120000
      operationId: createTransferDumpTransferFiles5m
      parameters: []
