  /api/transfer-history/{monitorId}/files-recursive:
    get:
      summary: Get transfer files recursively for a monitor ID
      description: Retrieves transfer files recursively for a given monitor ID with cursor pagination.
        Defaults to 50 records and caps limit at 100.
      tags:
      - Transfer History
      parameters:
      - in: path
        name: monitorId
        required: true
        schema:
          type: string
        description: Monitor ID of the transfer to get recursive file list
      - in: query
        name: workSpaceId
        required: false
        schema:
          type: string
        description: Workspace ID for tenant context (defaults to authenticated user's workSpaceId if
          not provided)
      - in: query
        name: parentPath
        required: false
        schema:
          type: string
        description: Parent source path to list from
      - in: query
        name: parentHash
        required: false
        schema:
          type: string
        description: Encoded parent source path to list from
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
        description: Page size. Defaults to 50 and is capped at 100.
      - in: query
        name: cursor
        required: false
        schema:
          type: string
        description: Cursor returned by the previous response
      responses:
        '200':
          description: Successful paginated response with transfer files
          content:
            application/json:
              schema:
                type: object
                properties:
                  sourceRoot:
                    type: string
                    description: Root path of the source
                  targetRoot:
                    type: string
                    description: Root path of the target
                  routeRoot:
                    type: string
                    description: Current traversal root path
                  parentPath:
                    type: string
                    description: Current parent path
                  limit:
                    type: integer
                  totalRows:
                    type: integer
                    description: Total matching rows for the current root
                  hasMore:
                    type: boolean
                  nextCursor:
                    type: string
                    nullable: true
                  children:
                    type: array
                    description: Current page of files
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: file
                        name:
                          type: string
                        monitorId:
                          type: string
                        transferId:
                          type: string
                        sourceFileName:
                          type: string
                        targetFileName:
                          type: string
                        status:
                          type: integer
                        sourceFilePath:
                          type: string
                        sourceRootPath:
                          type: string
                        targetRootPath:
                          type: string
                        targetPath:
                          type: string
                        isFolder:
                          type: boolean
                        sourceFileSize:
                          type: integer
                          format: int64
                        fileSize:
                          type: integer
                          format: int64
                        code:
                          type: string
                          nullable: true
                        errorCode:
                          type: string
                          nullable: true
                        sourceFileHash:
                          type: string
        '404':
          description: Transfer history not found
        '500':
          description: Internal server error
      operationId: listTransferHistoryFilesRecursive
