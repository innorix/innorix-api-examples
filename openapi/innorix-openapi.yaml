  /api/device/compatible-devices:
    get:
      summary: Get compatible devices
      description: 'Returns a paginated list of devices whose policy (in irx_policyManagement, scopeType
        = 3 = DEVICE)

        matches the specified transfer-permission and network-zone criteria.


        **transferPermission** values:

        - `receiveOnly` → devices with WRITE_ONLY permission (can only receive files)

        - `sendOnly`    → devices with READ_ONLY permission (can only send files)

        - `both`        → devices with READ_WRITE permission (can send and receive)

        - *(omit)*      → all devices regardless of transfer permission


        **networkPolicy** values:

        - `sameNetwork`  → devices restricted to SAME_ZONE_ONLY

        - `crossNetwork` → devices allowed on any network zone (ALLOW_ALL)

        - *(omit)*       → all devices regardless of network zone

        '
      tags:
      - Device
      parameters:
      - in: query
        name: transferPermission
        required: false
        schema:
          type: string
          enum:
          - receiveOnly
          - sendOnly
          - both
        description: Filter by transfer permission set on the device policy.
      - in: query
        name: networkPolicy
        required: false
        schema:
          type: string
          enum:
          - sameNetwork
          - crossNetwork
        description: Filter by network zone set on the device policy.
      - in: query
        name: keyword
        required: false
        schema:
          type: string
          default: ''
        description: Filter devices by name (partial match).
      - in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: listDeviceCompatibleDevices
